name: Build Nabat Trial APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: nabat_android_app
        run: gradle assembleDebug --no-daemon

      - name: Upload Nabat Trial APK
        uses: actions/upload-artifact@v4
        with:
          name: Nabat-Trial-APK
          path: nabat_android_app/app/build/outputs/apk/debug/app-debug.apk
